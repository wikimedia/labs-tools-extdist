[tox]

# Ensure 1.6+ is used to support 'skipsdist'
minversion = 1.6

# Do not run install command
skipsdist = True

# Environments to execute when invoking 'tox'
# 20261023 extdist WMCS instance is on Trixie which has Python 3.13
envlist = py{313}-{flake8,test}

[testenv]
commands =
    flake8: flake8
    test: pytest
deps =
    flake8: flake8
    test: pytest
    test: requests

[flake8]
max_line_length = 120
